name: Security & Vulnerability Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1' # Run weekly on Mondays

permissions:
  contents: read

jobs:
  audit:
    name: Security Compliance & Audit Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Wixfox Security Compliance Audit
        run: |
          chmod +x infrastructure/security/security-audit.sh
          ./infrastructure/security/security-audit.sh

      - name: Verify Gitignore & Secrets
        run: |
          chmod +x infrastructure/security/verify-secrets.sh
          ./infrastructure/security/verify-secrets.sh .env.example

  trivy:
    name: Trivy Container & Filesystem Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
