<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="foxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="50%" stop-color="#FF8C35" />
      <stop offset="100%" stop-color="#1A6FD4" />
    </linearGradient>
    <linearGradient id="foxOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C35" />
      <stop offset="60%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#D95300" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#FF6B00" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#foxBg)" filter="url(#glow)" />
  
  <!-- Sleek Modern Fox Face Geometric Vectors -->
  <g transform="translate(14, 16)">
    <!-- Left Ear -->
    <polygon points="12,14 44,40 18,60" fill="#FFFFFF" opacity="0.95" />
    <polygon points="18,22 38,42 24,52" fill="#0A0C10" />
    
    <!-- Right Ear -->
    <polygon points="80,14 48,40 74,60" fill="#FFFFFF" opacity="0.95" />
    <polygon points="74,22 54,42 68,52" fill="#0A0C10" />
    
    <!-- Face Mask Top -->
    <polygon points="46,30 78,58 46,86 14,58" fill="#FFFFFF" />
    
    <!-- Orange Core Face -->
    <polygon points="46,36 72,58 46,82 20,58" fill="url(#foxOrange)" />
    
    <!-- White Cheeks -->
    <polygon points="46,64 72,58 58,78 46,82" fill="#FFFFFF" />
    <polygon points="46,64 20,58 34,78 46,82" fill="#FFFFFF" />
    
    <!-- Eyes -->
    <polygon points="32,54 40,56 36,60" fill="#0A0C10" />
    <polygon points="60,54 52,56 56,60" fill="#0A0C10" />
    
    <!-- Nose Tip -->
    <polygon points="43,78 49,78 46,83" fill="#0A0C10" />
  </g>
</svg>
