<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="mountGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="400" fill="url(#skyGrad)" />

  <!-- Sun -->
  <rect x="950" y="40" width="60" height="60" fill="url(#sunGrad)" opacity="0.9" rx="4" />

  <!-- Pixel Clouds -->
  <rect x="80" y="60" width="160" height="30" fill="#FFFFFF" opacity="0.75" rx="4" />
  <rect x="120" y="45" width="80" height="15" fill="#FFFFFF" opacity="0.75" rx="2" />
  <rect x="620" y="80" width="220" height="35" fill="#FFFFFF" opacity="0.75" rx="4" />
  <rect x="680" y="60" width="110" height="20" fill="#FFFFFF" opacity="0.75" rx="2" />

  <!-- Distant Mountains -->
  <polygon points="0,400 0,260 120,200 280,270 420,180 620,280 820,190 980,270 1200,210 1200,400" fill="url(#mountGrad)" />
  <polygon points="120,200 160,225 100,225" fill="#F8FAFC" opacity="0.8" />
  <polygon points="420,180 460,215 390,215" fill="#F8FAFC" opacity="0.8" />
  <polygon points="820,190 860,225 790,225" fill="#F8FAFC" opacity="0.8" />

  <!-- Midground Hills -->
  <polygon points="0,400 0,300 240,260 480,310 750,250 1020,300 1200,270 1200,400" fill="#166534" />

  <!-- Minecraft Castle Fortress -->
  <g fill="#475569">
    <!-- Main Keep -->
    <rect x="580" y="160" width="140" height="150" fill="#64748B" />
    <!-- Battlements -->
    <rect x="580" y="145" width="25" height="15" fill="#475569" />
    <rect x="615" y="145" width="25" height="15" fill="#475569" />
    <rect x="650" y="145" width="25" height="15" fill="#475569" />
    <rect x="685" y="145" width="25" height="15" fill="#475569" />
    <!-- Left Tower -->
    <rect x="520" y="130" width="60" height="180" fill="#475569" />
    <polygon points="510,130 550,70 590,130" fill="#1E3A8A" />
    <!-- Right Tower -->
    <rect x="720" y="130" width="60" height="180" fill="#475569" />
    <polygon points="710,130 750,70 790,130" fill="#1E3A8A" />
    <!-- Castle Windows & Gate -->
    <rect x="635" y="240" width="30" height="70" fill="#1E293B" rx="15" />
    <rect x="640" y="180" width="20" height="30" fill="#0F172A" rx="4" />
    <rect x="540" y="170" width="15" height="25" fill="#0F172A" rx="2" />
    <rect x="740" y="170" width="15" height="25" fill="#0F172A" rx="2" />
  </g>

  <!-- Foreground Grass Landscape -->
  <polygon points="0,400 0,330 320,310 650,330 980,310 1200,340 1200,400" fill="url(#grassGrad)" />

  <!-- Voxel Trees -->
  <!-- Tree 1 -->
  <rect x="80" y="270" width="24" height="70" fill="#78350F" />
  <rect x="50" y="190" width="84" height="85" fill="#15803D" rx="6" />
  <rect x="62" y="170" width="60" height="30" fill="#22C55E" rx="4" />

  <!-- Tree 2 -->
  <rect x="220" y="280" width="20" height="60" fill="#78350F" />
  <rect x="195" y="210" width="70" height="75" fill="#166534" rx="6" />
  <rect x="205" y="195" width="50" height="25" fill="#22C55E" rx="4" />

  <!-- Tree 3 -->
  <rect x="880" y="270" width="24" height="70" fill="#78350F" />
  <rect x="850" y="190" width="84" height="85" fill="#15803D" rx="6" />
  <rect x="862" y="170" width="60" height="30" fill="#22C55E" rx="4" />

  <!-- Tree 4 -->
  <rect x="1040" y="280" width="22" height="65" fill="#78350F" />
  <rect x="1010" y="200" width="80" height="85" fill="#166534" rx="6" />

  <!-- Dark Ambient Overlay for Text Readability -->
  <rect width="1200" height="400" fill="#030712" opacity="0.4" />
</svg>
