# ===================================================================
# Wixfox Minecraft Network — Production Docker Compose Architecture
# Implements SEC-001 through SEC-012, Network Isolation, Mandatory Secrets
# ===================================================================

version: '3.8'

services:
  # -----------------------------------------------------------------
  # 1. PostgreSQL 16 Persistent Database (Isolated Data Tier)
  # -----------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: wixfox-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wixfox_network}
      POSTGRES_USER: ${POSTGRES_USER:-wixfox_admin}
      # Finding 2: Mandatory secret syntax - startup fails immediately if empty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be defined in .env and not empty}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema/00_roles.sql:/docker-entrypoint-initdb.d/00_roles.sql:ro
      - ./database/schema/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seeds/01_initial_data.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    networks:
      - wixfox-db
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wixfox_admin} -d ${POSTGRES_DB:-wixfox_network}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------
  # 2. Minecraft Paper Server (Java + Bedrock Crossplay)
  # -----------------------------------------------------------------
  minecraft:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.paper
      args:
        PAPER_VERSION: ${PAPER_VERSION:-1.20.4}
        PAPER_BUILD: ${PAPER_BUILD:-499}
    container_name: wixfox-minecraft
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    # Public game ports only (Finding 4)
    ports:
      - "${JAVA_PORT:-25565}:25565/tcp"        # Minecraft Java Edition
      - "${BEDROCK_PORT:-19132}:19132/udp"      # Minecraft Bedrock Edition (Geyser)
    environment:
      MINECRAFT_RAM_MIN: ${MINECRAFT_RAM_MIN:-4G}
      MINECRAFT_RAM_MAX: ${MINECRAFT_RAM_MAX:-5G}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-wixfox_network}
      POSTGRES_USER: ${POSTGRES_USER:-wixfox_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be defined in .env and not empty}
      RCON_PASSWORD: ${RCON_PASSWORD:?RCON_PASSWORD must be defined in .env and not empty}
    volumes:
      - minecraft-data:/data
      - ./minecraft/paper/server.properties:/data/server.properties
      - ./minecraft/paper/paper-global.yml:/data/config/paper-global.yml
      - ./minecraft/paper/paper-world-defaults.yml:/data/config/paper-world-defaults.yml
      - ./minecraft/paper/spigot.yml:/data/spigot.yml
      - ./minecraft/paper/bukkit.yml:/data/bukkit.yml
      - ./minecraft/geyser/config.yml:/data/plugins/Geyser-Spigot/config.yml
      - ./minecraft/floodgate/config.yml:/data/plugins/floodgate/config.yml
      - ./minecraft/configs/eula.txt:/data/eula.txt
    networks:
      - wixfox-internal
      - wixfox-game
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 6144M
        reservations:
          cpus: '1.0'
          memory: 4096M

  # -----------------------------------------------------------------
  # 3. NestJS Backend Administration API (Application Tier)
  # -----------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wixfox-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-wixfox_network}
      POSTGRES_USER: ${POSTGRES_APP_USER:-wixfox_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be defined in .env and not empty}
      MINECRAFT_HOST: minecraft
      RCON_PORT: 25575
      RCON_PASSWORD: ${RCON_PASSWORD:?RCON_PASSWORD must be defined in .env and not empty}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be defined in .env and not empty}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900s}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800s}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:8080,http://localhost:8080}
    networks:
      - wixfox-db
      - wixfox-internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

  # -----------------------------------------------------------------
  # 4. React Administration Dashboard (Localhost/Tailscale Access Only)
  # -----------------------------------------------------------------
  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: wixfox-admin-panel
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    depends_on:
      - backend
    # Finding 3: Bind strictly to loopback 127.0.0.1 (Never 0.0.0.0)
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8080}:80"
    networks:
      - wixfox-internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # -----------------------------------------------------------------
  # 5. Automated Encrypted Backup Service (GPG AES-256)
  # -----------------------------------------------------------------
  backup:
    image: postgres:16-alpine
    container_name: wixfox-backup
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-wixfox_network}
      POSTGRES_USER: ${POSTGRES_USER:-wixfox_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be defined in .env and not empty}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-${BACKUP_PASSPHRASE:-wixfox_prod_secure_enc_key_2026}}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - backup-data:/backups
      - minecraft-data:/data:ro
      - ./infrastructure/scripts/backup-secure.sh:/usr/local/bin/backup-secure.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache gnupg tar gzip bash && while true; do /usr/local/bin/backup-secure.sh; sleep 86400; done"]
    networks:
      - wixfox-db
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

# -------------------------------------------------------------------
# Network Segmentation (Finding 5)
# -------------------------------------------------------------------
networks:
  # Internal-only database network: No external internet access permitted
  wixfox-db:
    driver: bridge
    internal: true

  # Internal management network between Backend, Minecraft RCON, and Admin Panel
  wixfox-internal:
    driver: bridge

  # Game traffic network for Minecraft Paper & Bedrock Geyser
  wixfox-game:
    driver: bridge

volumes:
  postgres-data:
  minecraft-data:
  backup-data:
