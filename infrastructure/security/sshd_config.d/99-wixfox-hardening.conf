# ===================================================================
# Wixfox Minecraft Network — SSH Daemon Security Hardening
# Production Configuration (PRD Section 5.2)
# File: /etc/ssh/sshd_config.d/99-wixfox-hardening.conf
# ===================================================================

# Disable direct root login completely
PermitRootLogin no

# Disable all password authentication; enforce SSH public key exchange
PasswordAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no

# Disable legacy/unnecessary forwarding protocols
AllowTcpForwarding no
X11Forwarding no

# Brute-force throttling & strict timeout
MaxAuthTries 3
LoginGraceTime 30
MaxStartups 3:50:10

# Security cipher suites & key exchange algorithms (Modern Cryptography)
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# Session timeouts
ClientAliveInterval 300
ClientAliveCountMax 2
UsePAM yes
