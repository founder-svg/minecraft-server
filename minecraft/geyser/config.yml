# GeyserMC Configuration
# Enables Bedrock Edition (Pocket Edition, Console, Windows 10/11) to connect to Wixfox Paper Server
bedrock:
  address: 0.0.0.0
  port: 19132
  clone-remote-port: false
  motd1: "Wixfox Minecraft Network"
  motd2: "Survival SMP [Java + Bedrock]"
  server-name: "Wixfox SMP"
  compression-level: 6
  enable-proxy-protocol: false

remote:
  address: 127.0.0.1
  port: 25565
  auth-type: floodgate
  use-proxy-protocol: false

floodgate-key-file: ../Floodgate/key.pem

saved-user-logins:
  - ""

command-suggestions: true
passthrough-motd: true
passthrough-protocol-name: false
passthrough-player-counts: true
legacy-ping-passthrough: false
ping-passthrough-interval: 3
forward-player-ping: true

max-players: 20
debug-mode: false
allow-third-party-capes: true
allow-third-party-ears: false
show-cooldown: title
show-coordinates: true
custom-sky: true

metrics:
  enabled: false
  uuid: 00000000-0000-0000-0000-000000000000
