# Spigot Configuration for Wixfox
settings:
  debug: false
  save-user-cache-on-stop-only: true
  moved-wrongly-threshold: 0.0625
  moved-too-quickly-multiplier: 10.0
  user-cache-size: 1000
  timeout-time: 60
  restart-on-crash: false
  netty-threads: 4
  attribute:
    maxHealth:
      max: 2048.0
    movementSpeed:
      max: 2048.0
    attackDamage:
      max: 2048.0
  log-villager-deaths: false
  log-named-deaths: false
messages:
  whitelist: You are not whitelisted on this server!
  unknown-command: Unknown command. Type "/help" for help.
  server-full: The server is full! (20/20 players). Upgrade to VIP to bypass.
  outdated-client: Outdated client! Please use {0}
  outdated-server: Outdated server! I'm still on {0}
  restart: Server is restarting...
advancements:
  disable-saving: false
  disabled:
  - minecraft:story/disabled
world-settings:
  default:
    verbose: false
    view-distance: 8
    simulation-distance: 6
    mob-spawn-range: 4
    entity-tracking-range:
      players: 48
      animals: 32
      monsters: 32
      misc: 24
      other: 48
    entity-activation-range:
      animals: 16
      monsters: 24
      raiders: 32
      misc: 8
      water: 12
      villagers: 16
      flying-monsters: 24
      wake-up-inactive:
        animals-max-per-tick: 4
        animals-every: 1200
        animals-for: 100
        monsters-max-per-tick: 8
        monsters-every: 400
        monsters-for: 100
        villagers-max-per-tick: 4
        villagers-every: 600
        villagers-for: 100
        flying-monsters-max-per-tick: 4
        flying-monsters-every: 200
        flying-monsters-for: 100
    ticks-per:
      hopper-transfer: 8
      hopper-check: 8
    merge-radius:
      item: 3.5
      exp: 4.0
    item-despawn-rate: 4000
    arrow-despawn-rate: 200
